name: TAXI PRO Live Radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taxi-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live disruptions
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          url = 'https://www.wienerlinien.at/ogd_realtime/trafficInfoList?name=stoerungkurz&name=stoerunglang'
          req = urllib.request.Request(url, headers={'Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              raw = json.load(response)
          events = raw['data']['trafficInfos']
          if not isinstance(events, list):
              raise ValueError('Invalid response')
          result = {
              'source': 'Stadt Wien - Wiener Linien',
              'updated': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'events': events
          }
          with open('radar.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          PY
      - name: Save radar data
        run: |
          git config user.name "TAXI PRO Radar"
          git config user.email "radar@users.noreply.github.com"
          git add radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Update live radar"
          git pull --rebase
          git push
