const root='https://znnrrfrykluzhkcrvboh.supabase.co',key='sb_publishable_EtPcLHtzk2hMFsYyER2csw_PMy36tCa',q=x=>document.getElementById(x);let token=null;const msg=x=>q('status').textContent=x;
async function api(path,method,body,t){const res=await fetch(root+path,{method,headers:{apikey:key,Authorization:'Bearer '+(t||key),'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(j.msg||j.message||j.error_description||'Request failed '+res.status);return j}
