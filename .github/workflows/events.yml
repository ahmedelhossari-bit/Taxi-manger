name: Vienna Live Events
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch events
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          from html.parser import HTMLParser
          from datetime import datetime
          from zoneinfo import ZoneInfo
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts=[]
              def handle_data(self,data):
                  self.parts.append(data)
          url='https://spielplan.musikverein.at/spielplan'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          p=Parser()
          p.feed(urllib.request.urlopen(req,timeout=60).read().decode('utf-8'))
          text=' '.join(p.parts)
          pat=r'(\d{2}\.\d{2}\.\d{4})\s+(\d{1,2}:\d{2})\s*Uhr\s*[-–−]\s*(\d{1,2}:\d{2})\s*Uhr'
          now=datetime.now(ZoneInfo('Europe/Vienna'))
          events=[]
          for date,start,end in sorted(set(re.findall(pat,text))):
              day=datetime.strptime(date,'%d.%m.%Y').date()
              if day>=now.date():
                  events.append(dict(venue='Musikverein',date=day.isoformat(),start=start,end=end,source=url))
          if not events:
              raise RuntimeError('No upcoming events found')
          events.sort(key=lambda e:(e['date'],e['end']))
          with open('events.json','w') as f:
              json.dump(dict(updated=now.isoformat(),events=events),f,ensure_ascii=False,indent=2)
          PY
      - name: Save events
        run: |
          git config user.name "Taxi Pro Bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Update Vienna events" && git push)
