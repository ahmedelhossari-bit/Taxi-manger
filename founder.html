<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>TAXI PRO | Founder Access</title><style>body{background:#151619;color:#eee;font:16px system-ui;display:grid;place-items:center;min-height:95vh;margin:0}main{width:min(85%,390px);padding:24px;border:1px solid #524631;border-radius:24px;background:#202124}h1,footer{color:#d8b575}h1{letter-spacing:4px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:10px;font:inherit}input{background:#303136;border:1px solid #666;color:white}button{background:#d8b575;border:0;font-weight:bold}footer{font-size:11px;margin-top:24px;text-align:right}p{overflow-wrap:anywhere}[hidden]{display:none!important}</style><main><h1>TAXI PRO</h1><h2>Founder Access</h2><p>Private account activation · no driver registration</p><form id="login"><label>Founder email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password"></label><button type="submit">Sign in</button><button type="button" id="activate">Set / reset password by email</button></form><form id="setup" hidden><label>Choose your password<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><button>Set password</button></form><section id="dashboard" hidden><h2>Founder dashboard</h2><p id="counts"></p><div id="drivers"></div><button id="refresh">Refresh</button><button id="logout">Sign out</button></section><p id="status" role="status"></p><footer>Founded by Ahmed Elhosary</footer></main><script>
const root='https://znnrrfrykluzhkcrvboh.supabase.co',key='sb_publishable_EtPcLHtzk2hMFsYyER2csw_PMy36tCa',q=x=>document.getElementById(x);let token=null;const msg=x=>q('status').textContent=x;
async function api(path,method,body,t){const res=await fetch(root+path,{method,headers:{apikey:key,Authorization:'Bearer '+(t||key),'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(j.msg||j.message||j.error_description||'Request failed '+res.status);return j}
async function owner(t){if(await api('/rest/v1/rpc/current_user_is_founder','POST',{},t)!==true)throw Error('Founder access denied');token=t}
async function dashboard(){await owner(token);q('login').hidden=true;q('setup').hidden=true;q('dashboard').hidden=false;const rows=await api('/rest/v1/driver_profiles?select=id,username,full_name,status&order=created_at.desc','GET',null,token);q('counts').textContent=rows.length+' driver accounts · '+rows.filter(x=>x.status==='pending').length+' pending';q('drivers').replaceChildren();for(const row of rows){const el=document.createElement('p');el.textContent=row.full_name+' (@'+row.username+') — '+row.status;q('drivers').append(el);for(const status of ['approved','rejected','suspended']){const b=document.createElement('button');b.textContent=status==='approved'?'Approve (Beta)':status==='rejected'?'Reject':'Suspend';b.onclick=async()=>{if(!confirm(status+' '+row.username+'?'))return;try{await owner(token);await api('/rest/v1/driver_profiles?id=eq.'+encodeURIComponent(row.id),'PATCH',{status},token);await dashboard()}catch(e){msg(e.message)}};q('drivers').append(b)}}msg('Founder verified · Beta approvals are manual; no document verification.')}
q('refresh').onclick=()=>dashboard().catch(e=>msg(e.message));q('logout').onclick=async()=>{try{await api('/auth/v1/logout','POST',{},token)}finally{token=null;location.replace(location.pathname)}};
q('login').onsubmit=async e=>{e.preventDefault();try{const s=await api('/auth/v1/token?grant_type=password','POST',{email:q('email').value.trim(),password:q('loginPassword').value});q('loginPassword').value='';await owner(s.access_token);await dashboard()}catch(e){token=null;msg(e.message)}};
q('activate').onclick=async()=>{if(!q('email').reportValidity())return;const b=q('activate');b.disabled=true;try{await api('/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),'POST',{email:q('email').value.trim(),create_user:false});msg('Check your email. If the link opens localhost, the project redirect URL still needs configuration.')}catch(e){msg(e.message)}finally{b.disabled=false}};
(async()=>{const p=new URLSearchParams(location.hash.slice(1));if(!location.hash)return;history.replaceState(null,'',location.pathname);if(p.get('error')){msg(p.get('error_description')||'Activation failed');return}const t=p.get('access_token');if(!t)return;try{const u=await api('/auth/v1/user','GET',null,t);if(!u.email_confirmed_at)throw Error('Email not verified');await owner(t);q('login').hidden=true;q('setup').hidden=false;msg('Email verified. Choose your private password.')}catch(e){msg(e.message)}})();
q('setup').onsubmit=async e=>{e.preventDefault();if(!token)return;try{await api('/auth/v1/user','PUT',{password:q('password').value},token);q('password').value='';q('setup').hidden=true;await dashboard()}catch(e){msg(e.message)}};
</script></html>
