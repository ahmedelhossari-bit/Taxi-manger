<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Taxi Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#101827;color:white;font:16px Arial}h1{text-align:center;color:#ffd54a}section{background:#1e293b;padding:16px;border-radius:18px;margin:14px 0}input,select,button,textarea{width:100%;padding:13px;margin:5px 0;border:0;border-radius:10px;font:inherit}input,select,textarea{background:#334155;color:white}button{background:#ffd54a;font-weight:bold;color:#101827}.green{background:#34d399}.red{background:#fb7185}.big{font-size:42px;color:#34d399;font-weight:bold}progress{width:100%;accent-color:#34d399}small{color:#b9c5d6}.bar{background:#34d399;height:10px;border-radius:8px}.line{padding:10px 0;border-bottom:1px solid #475569}
</style>
</head>
<body>
<h1>🚕 Taxi Manager</h1>
<section>
<input id="day" type="date" onchange="render()">
<small>إجمالي الدخل</small><div class="big" id="income"></div>
<progress id="progress" max="250"></progress>
<div id="summary"></div>
</section>
<section>
<h2>⏱ إدارة الشيفت</h2><p id="status"></p>
<button class="green" onclick="shift('start')">بداية الشغل</button>
<button onclick="shift('pause')">بداية الراحة</button>
<button onclick="shift('resume')">نهاية الراحة</button>
<button class="red" onclick="shift('end')">إنهاء الشغل</button>
</section>
<section>
<h2>🚕 تسجيل مشوار</h2>
<input id="fare" type="number" inputmode="decimal" placeholder="قيمة المشوار باليورو">
<input id="time" type="time">
<input id="area" placeholder="المنطقة (اختياري)">
<button class="green" onclick="add('trips')">حفظ المشوار</button>
</section>
<section>
<h2>💳 المصاريف</h2>
<select id="category"><option>أكل وشرب</option><option>بنزين</option><option>غسيل العربية</option><option>ركن وغرامات</option><option>شخصية</option><option>أخرى</option></select>
<input id="expense" type="number" inputmode="decimal" placeholder="المبلغ">
<button onclick="add('expenses')">حفظ المصروف</button>
</section>
<section><h2>📊 التحليل اليومي</h2><div id="analysis"></div><div id="chart"></div></section>
<section><h2>📈 الأسبوع والشهر</h2><div id="reports"></div></section>
<section><h2>🧠 أفضل ساعات الشغل</h2><div id="best"></div></section>
<section><h2>📋 سجل اليوم</h2><div id="history"></div></section>
<section>
<h2>⚙️ الإعدادات</h2>
<label>الهدف اليومي €</label><input id="target" type="number">
<label>إيجار العربية أسبوعياً €</label><input id="rent" type="number">
<label>البنزين المتوقع يومياً €</label><input id="fuel" type="number">
<label>الالتزامات الشهرية €</label><input id="fixed" type="number">
<button onclick="settings()">حفظ الإعدادات</button>
</section>
<section><h2>💾 النسخ الاحتياطي</h2>
<button onclick="backup()">نسخ البيانات</button>
<textarea id="backupData" placeholder="بيانات النسخة الاحتياطية"></textarea>
<button onclick="restore()">استرجاع البيانات</button>
</section>
<script>
const $=id=>document.getElementById(id);
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>fmt(new Date());
const clock=()=>new Date().toTimeString().slice(0,5);
const money=n=>'€'+n.toFixed(2);
const sum=a=>a.reduce((v,x)=>v+x.amount,0);
const date=()=>$('day').value;
let db;
try{db=JSON.parse(localStorage.getItem('taxiV4'))}catch(e){}
db=db||{trips:[],expenses:[],shifts:{},settings:{target:250,rent:600,fuel:20,fixed:1256}};
function save(){try{localStorage.setItem('taxiV4',JSON.stringify(db))}catch(e){alert('تعذر الحفظ')}render()}
function add(type){
let el=$(type==='trips'?'fare':'expense'),amount=Number(el.value);
if(!Number.isFinite(amount)||amount<=0)return alert('اكتب مبلغ صحيح');
db[type].push({date:date(),amount,time:type==='trips'?$('time').value||clock():clock(),area:$('area').value,category:$('category').value});
el.value='';$('time').value='';$('area').value='';save()
}
function shift(a){
let d=date(),s=db.shifts[d],n=Date.now();
if(a==='start'){
if(d!==today()||s)return alert('اختار اليوم بدون شيفت سابق');
if(Object.values(db.shifts).some(x=>!x.end))return alert('انهي الشيفت السابق أولا');
db.shifts[d]={start:n,end:0,pause:0,breaks:[]}
}else{
if(!s||s.end)return alert('لا يوجد شيفت نشط');
if(a==='pause'&&!s.pause)s.pause=n;
if((a==='resume'||a==='end')&&s.pause){s.breaks.push([s.pause,n]);s.pause=0}
if(a==='end')s.end=n
}save()
}
function hours(d){
let s=db.shifts[d];if(!s)return 0;
return Math.max(0,((s.end||Date.now())-s.start-s.breaks.reduce((v,b)=>v+b[1]-b[0],0)-(s.pause?Date.now()-s.pause:0))/3600000)
}
function duration(h){let m=Math.round(h*60);return Math.floor(m/60)+' ساعة '+m%60+' دقيقة'}
function settings(){
let v={};for(let k of ['target','rent','fuel','fixed']){v[k]=Number($(k).value);if(!Number.isFinite(v[k])||v[k]<0||k==='target'&&!v[k])return alert('راجع الأرقام')}
db.settings=v;save()
}
function removeItem(t,i){if(confirm('حذف التسجيل؟')){db[t].splice(i,1);save()}}
function costs(t,e,ds){return sum(e)+ds.filter(d=>!e.some(x=>x.date===d&&x.category==='بنزين')).length*db.settings.fuel}
function safe(s){let x=document.createElement('span');x.textContent=s||'';return x.innerHTML}
function render(){
let d=date(),s=db.settings,t=db.trips.filter(x=>x.date===d),e=db.expenses.filter(x=>x.date===d),n=sum(t),h=hours(d),r=h?n/h:0,sh=db.shifts[d],c=costs(t,e,sh||t.length?[d]:[]);
$('income').textContent=money(n);
$('progress').max=s.target;$('progress').value=n;
$('summary').innerHTML='المتبقي للهدف: '+money(Math.max(0,s.target-n))+'<p>المشاوير: '+t.length+' | صافي اليوم قبل الالتزامات الشخصية: '+money(n-c-s.rent/7)+'</p><p>العمل الفعلي: '+duration(h)+' | '+money(r)+'/ساعة</p>';
$('status').textContent=!sh?'لم يبدأ':sh.end?'انتهى':sh.pause?'☕ استراحة':'🟢 شغال';
$('analysis').innerHTML='متوسط المشوار: '+money(t.length?n/t.length:0)+'<p>المصاريف: '+money(c)+'</p><p>الوقت المتوقع لتحقيق الهدف: '+(r?duration(Math.max(0,s.target-n)/r):'غير متاح')+'</p>';
let hist=Array(24).fill(0);t.forEach(x=>hist[Number(x.time.slice(0,2))]+=x.amount);
$('chart').innerHTML=hist.map((v,i)=>v?'<p>'+i+':00 — '+money(v)+'</p><div class="bar" style="width:'+v/Math.max(...hist)*100+'%"></div>':'').join('');
let start=new Date(d+'T12:00:00');start.setDate(start.getDate()-(start.getDay()+6)%7);
let end=new Date(start);end.setDate(end.getDate()+6);
let month=d.slice(0,7),days=new Date(Number(d.slice(0,4)),Number(d.slice(5,7)),0).getDate();
function report(label,f,rent,fixed){
let a=db.trips.filter(x=>f(x.date)),b=db.expenses.filter(x=>f(x.date)),ds=[...new Set([...a.map(x=>x.date),...Object.keys(db.shifts).filter(f)])],wh=ds.reduce((v,x)=>v+hours(x),0);
return '<h3>'+label+'</h3>الدخل: '+money(sum(a))+'<p>الصافي بعد التكاليف: '+money(sum(a)-costs(a,b,ds)-rent-fixed)+'</p>ساعات العمل: '+duration(wh)+'<p>متوسط الساعة: '+money(wh?sum(a)/wh:0)+'</p>'
}
$('reports').innerHTML=report('الأسبوع',x=>x>=fmt(start)&&x<=fmt(end),s.rent,0)+report('الشهر',x=>x.startsWith(month),s.rent*days/7,s.fixed);
let revenue=Array(24).fill(0),exposure=Array(24).fill(0),weekday=new Date(d+'T12:00:00').getDay(),sample=0;
for(let [key,v] of Object.entries(db.shifts)){
if(!v.end||new Date(key+'T12:00:00').getDay()!==weekday)continue;
sample++;
for(let i=v.start;i<v.end;i+=60000){
if(v.breaks.some(b=>i>=b[0]&&i<b[1]))continue;
exposure[new Date(i).getHours()]+=Math.min(60000,v.end-i)/3600000
}
db.trips.filter(x=>x.date===key).forEach(x=>revenue[Number(x.time.slice(0,2))]+=x.amount)
}
let ranked=revenue.map((v,i)=>({i,h:exposure[i],r:exposure[i]?v/exposure[i]:0})).filter(x=>x.h>=2).sort((a,b)=>b.r-a.r);
$('best').innerHTML=sample<3?'محتاج 3 شيفتات مكتملة على الأقل لنفس يوم الأسبوع.':('عدد الشيفتات: '+sample+ranked.slice(0,5).map(x=>'<p>'+x.i+':00 — '+money(x.r)+'/ساعة</p>').join('')+'<small>تقدير تاريخي وليس ضماناً للدخل. الأجرة محسوبة عند انتهاء المشوار.</small>');
$('history').innerHTML=['trips','expenses'].map(k=>db[k].map((x,i)=>x.date===d?'<div class="line">'+safe(x.time)+' — '+money(x.amount)+' — '+safe(k==='trips'?x.area:x.category)+'<button class="red" onclick="removeItem(\''+k+'\','+i+')">حذف</button></div>':'').join('')).join('')
}
async function backup(){let t=JSON.stringify(db);$('backupData').value=t;try{await navigator.clipboard.writeText(t);alert('تم النسخ')}catch(e){$('backupData').select();alert('انسخ النص يدويا')}}
function restore(){try{let b=JSON.parse($('backupData').value);if(!Array.isArray(b.trips)||!Array.isArray(b.expenses)||!b.shifts||!b.settings)throw Error();if(confirm('استبدال البيانات الحالية؟')){db=b;save();loadSettings()}}catch(e){alert('نسخة غير صالحة')}}
function loadSettings(){for(let k of ['target','rent','fuel','fixed'])$(k).value=db.settings[k]}
$('day').value=today();loadSettings();render();setInterval(render,30000);
</script>
</body>
</html>
<script>
(function(){
const p=document.createElement('select');
p.id='paymentMethod';
['Cash','Visa','Uber','Bolt','Other'].forEach(k=>p.add(new Option(k,k)));
document.getElementById('fare').after(p);
const box=document.createElement('div');
document.getElementById('summary').after(box);
const info=document.createElement('div');
document.getElementById('status').after(info);
const oldAdd=add;
add=function(k){
const count=db.trips.length;
oldAdd.apply(this,arguments);
if(k==='trips'&&db.trips.length>count){
db.trips[db.trips.length-1].payment=p.value;
save();
}
update();
};
function update(){
const d=document.getElementById('day').value;
const trips=db.trips.filter(x=>x.date===d);
box.innerHTML='<h3>طرق الدفع</h3>'+['Cash','Visa','Uber','Bolt','Other','غير محدد'].map(k=>'<p>'+k+': €'+trips.filter(x=>(x.payment||'غير محدد')===k).reduce((a,x)=>a+Number(x.amount),0).toFixed(2)+'</p>').join('');
const s=db.shifts[d];
const time=n=>n?new Date(n).toLocaleString('de-AT'):'—';
info.innerHTML=s?'<p>بداية الشغل: '+time(s.start)+'</p><p>نهاية الشغل: '+time(s.end)+'</p>':'';
}
document.addEventListener('click',()=>setTimeout(update,100));
document.getElementById('day').addEventListener('change',update);
setInterval(update,1000);
update();
})();
</script>
<script>
(function(){
if(document.getElementById('proCalendar'))return;
const el=id=>document.getElementById(id);
const day=el('day');
const eur=n=>'€'+Number(n||0).toFixed(2);
const total=a=>a.reduce((s,x)=>s+Number(x.amount||0),0);
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let style=document.createElement('style');
style.textContent=`
body{background:#101114!important;color:#f1f1f1!important;font-family:-apple-system,BlinkMacSystemFont,Arial!important;padding:14px 14px 110px!important}
h1,h2,h3{color:#dab77b!important}h1{letter-spacing:2px;font-size:32px}
section{background:#1c1d21!important;border:1px solid #34312c!important;border-radius:22px!important;padding:17px!important;box-shadow:0 5px 20px #0003}
input,select,textarea{box-sizing:border-box!important;max-width:100%;min-width:0;background:#292a2e!important;color:#fff!important;border:1px solid #414039!important;border-radius:12px!important;font-size:16px!important}
button{border-radius:12px!important;background:#d8b575!important;color:#151515!important;font-weight:700!important}
button.green{background:#d8b575!important}button.red{background:#98434b!important;color:white!important}
.big,#income{color:#d8b575!important}progress{accent-color:#d8b575!important}
.progrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;direction:ltr}
.progrid button{margin:0!important;padding:8px 0!important;min-height:61px;font-size:12px!important;overflow:hidden}
.progrid small{font-size:10px;display:block}
.prohead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prohead button{width:42px!important}
#proNav{position:fixed;bottom:0;left:0;right:0;background:#151619f5;display:flex;z-index:1000;border-top:1px solid #544630;padding:8px 5px calc(8px + env(safe-area-inset-bottom));direction:rtl;gap:4px}
#proNav button{flex:1;background:transparent!important;color:#d8b575!important;font-size:12px!important;margin:0!important;padding:10px 0!important}
#proCalendar textarea{width:100%;min-height:100px;padding:12px}
.prolabel{color:#aaa;font-size:13px;text-align:center;margin:6px 0}
.prohidden{display:none!important}
`;
document.head.appendChild(style);
document.title='TAXI PRO';
document.querySelector('h1').textContent='TAXI PRO';
let subtitle=document.createElement('div');
subtitle.className='prolabel';
subtitle.textContent='VIENNA · LUXURY BUSINESS EDITION';
document.querySelector('h1').after(subtitle);
let weekday=document.createElement('h3');
day.after(weekday);
let sections=Array.from(document.querySelectorAll('section'));
let cal=document.createElement('section');
cal.id='proCalendar';
cal.innerHTML='<h2>التقويم الشهري</h2><div class="prohead"><button id="proPrev">‹</button><b id="proMonth"></b><button id="proNext">›</button></div><div id="proDays" class="progrid"></div><p id="proDayInfo"></p><h3>ملاحظات اليوم</h3><textarea id="proNote" placeholder="اكتب ملاحظات يوم الشغل"></textarea><label>ظروف اليوم</label><select id="proCondition"><option>يوم طبيعي</option><option>أمطار</option><option>ثلوج</option><option>حفلات ومهرجانات</option><option>عطلة رسمية</option><option>زحمة مرورية</option><option>مشكلة في العربية</option><option>أخرى</option></select><label>كيلومترات اليوم</label><input id="proKm" type="number" min="0" inputmode="decimal" placeholder="km"><button id="proSave">حفظ تفاصيل اليوم</button><button id="proDetails">عرض حسابات اليوم</button>';
document.body.appendChild(cal);
let finance=document.createElement('section');
finance.id='proFinance';
finance.innerHTML='<h2>الإدارة المالية</h2><div id="proFinancialReport"></div><h3>الالتزامات الشهرية</h3><div id="proBills"></div>';
document.body.appendChild(finance);
let m=new Date(day.value+'T12:00:00');
m.setDate(1);
db.proDays=db.proDays||{};
db.proPaid=db.proPaid||{};
const note=el('proNote'),km=el('proKm'),condition=el('proCondition');
function readDay(){
const a=db.proDays[day.value]||{};
note.value=a.note||'';
km.value=a.km===undefined?'':a.km;
condition.value=a.condition||'يوم طبيعي';
}
function saveDetails(){
let n=Number(km.value);
if(!Number.isFinite(n)||n<0)return alert('راجع الكيلومترات');
db.proDays[day.value]={note:note.value,km:n,condition:condition.value};
save();
draw();
}
el('proSave').onclick=()=>{saveDetails();alert('تم حفظ تفاصيل اليوم')};
[note,km,condition].forEach(x=>x.addEventListener('change',saveDetails));
function choose(d){
day.value=d;
render();
day.dispatchEvent(new Event('change',{bubbles:true}));
}
function draw(){
weekday.textContent=new Date(day.value+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
el('proMonth').textContent=m.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
let grid=el('proDays');grid.replaceChildren();
['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(x=>{let b=document.createElement('div');b.className='prolabel';b.textContent=x;grid.appendChild(b)});
for(let i=0;i<(m.getDay()+6)%7;i++)grid.appendChild(document.createElement('div'));
let rows=[];
let days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
for(let i=1;i<=days;i++){
let dt=new Date(m.getFullYear(),m.getMonth(),i,12),d=fmt(dt);
let t=db.trips.filter(x=>x.date===d),s=db.shifts[d],n=total(t);
let worked=!!(s||t.length);
if(worked)rows.push({d,n});
let b=document.createElement('button');
b.style.setProperty('background',d===day.value?'#d8b575':worked?(n>=Number(db.settings.target||250)?'#214638':'#57452c'):dt.getDay()===1?'#353535':'#282a30','important');
b.style.setProperty('color',d===day.value?'#111':'#fff','important');
let label=worked?'€'+Math.round(n):dt.getDay()===1?'OFF':'—';
b.innerHTML=i+'<small>'+label+'</small>'+(db.proDays[d]?.note?'✎':'');
b.onclick=()=>choose(d);
grid.appendChild(b)
}
let t=db.trips.filter(x=>x.date===day.value),s=db.shifts[day.value];
el('proDayInfo').textContent='دخل اليوم: '+eur(total(t))+' | '+t.length+' مشوار | '+(s?.end?'الشيفت مكتمل':s?'شيفت مفتوح':'لا يوجد شيفت');
let sorted=rows.slice().sort((a,b)=>b.n-a.n);
let gross=rows.reduce((a,x)=>a+x.n,0);
let monthKey=fmt(m).slice(0,7);
let expenses=db.expenses.filter(x=>x.date.startsWith(monthKey));
let workdays=rows.length;
let estimatedFuel=rows.filter(x=>!expenses.some(e=>e.date===x.d&&String(e.category).includes('بنزين'))).length*Number(db.settings.fuel||0);
let rent=Number(db.settings.rent||0)*days/7;
let fixed=Number(db.settings.fixed||0);
let distance=Object.entries(db.proDays).filter(([d])=>d.startsWith(monthKey)).reduce((a,[d,v])=>a+Number(v.km||0),0);
let rem=0;
for(let i=1;i<=days;i++){let x=new Date(m.getFullYear(),m.getMonth(),i,12);if(fmt(x)>fmt(new Date())&&x.getDay()!==1)rem++}
el('proFinancialReport').innerHTML='<p>'+monthKey+'</p><p>دخل الشهر: '+eur(gross)+'</p><p>أيام العمل المسجلة: '+workdays+'</p><p>المسافة المسجلة: '+distance.toFixed(1)+' km</p><p>أفضل يوم: '+(sorted.length?sorted[0].d+' / '+eur(sorted[0].n):'—')+'</p><p>أقل يوم دخلا: '+(sorted.length?sorted[sorted.length-1].d+' / '+eur(sorted[sorted.length-1].n):'—')+'</p><p>إيجار العربية للشهر: '+eur(rent)+'</p><p>المصاريف والبنزين: '+eur(total(expenses)+estimatedFuel)+'</p><p>الصافي بعد التزامات الشهر كاملة: '+eur(gross-total(expenses)-estimatedFuel-rent-fixed)+'</p><p>الدخل المتوقع حتى نهاية الشهر: '+(workdays?eur(gross+gross/workdays*rem):'—')+'</p><small>تقديرات قبل الضرائب، والتوقع مبني على متوسط الدخل المسجل.</small>';
}
function bills(){
let box=el('proBills');box.replaceChildren();
let key=fmt(m).slice(0,7);
[['تحويل مصر',700],['إيجار البيت',397],['الخدمات',84],['التليفون والإنترنت - يوم 15',75]].forEach(([name,value])=>{
let row=document.createElement('p'),c=document.createElement('input');
c.type='checkbox';c.style.width='auto';
c.checked=!!db.proPaid[key+'|'+name];
c.onchange=()=>{db.proPaid[key+'|'+name]=c.checked;save()};
row.append(c,document.createTextNode(' '+name+' — '+eur(value)));
box.append(row)
})
}
el('proPrev').onclick=()=>{m.setMonth(m.getMonth()-1);draw();bills()};
el('proNext').onclick=()=>{m.setMonth(m.getMonth()+1);draw();bills()};
let nav=document.createElement('nav');nav.id='proNav';
function show(k){
[...sections,cal,finance].forEach(x=>x.classList.add('prohidden'));
let chosen=k==='home'?sections.slice(0,4):k==='calendar'?[cal]:k==='analysis'?sections.filter(x=>x.querySelector('#analysis,#reports,#best,#history')):[finance,...sections.filter(x=>x.querySelector('#target,#backupData'))];
chosen.forEach(x=>x.classList.remove('prohidden'));
if(k==='calendar'){readDay();draw()}
if(k==='finance'){draw();bills()}
window.scrollTo(0,0)
}

<script>
(function(){
if(window.luxShiftReady)return;
window.luxShiftReady=true;
const q=id=>document.getElementById(id);
const put=(id,v)=>q(id).textContent=v;
const hms=ms=>{let s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const tm=t=>t?new Date(t).toLocaleTimeString('en-GB',{timeZone:'Europe/Vienna',hour12:false}):'--:--:--';
let audio,alerts=new Set();
function unlock(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}
document.addEventListener('pointerdown',unlock);
function beep(){try{if(!audio||audio.state!=='running')return;[0,.4,.8].forEach(d=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+d;o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.25)})}catch(e){}}
const previous=shift;
shift=function(a){
let s=db.shifts[q('day').value];
if(a==='pause'&&s&&(s.breaks||[]).length>=2&&!confirm('استخدمت البريكين المخططين. هل تحتاج راحة إضافية؟'))return;
if(a==='end'&&!confirm('هل تريد إنهاء الشيفت؟'))return;
unlock();previous.apply(this,arguments);tick();
};
function tick(){
let now=Date.now(),s=db.shifts[q('day').value];
let active=!!(s&&!s.end),paused=!!(active&&s.pause),br=s?s.breaks||[]:[];
let elapsed=paused?Math.max(0,now-s.pause):0;
let rest=br.reduce((a,b)=>a+Number(b[1]-b[0]),0)+elapsed;
let work=s?Math.max(0,(s.end||now)-s.start-rest):0;
put('luxMode',paused?'BREAK TIME':active?'WORKING TIME':s?'SHIFT COMPLETE':'READY TO START');
put('luxTimer',hms(paused?elapsed:work));
put('luxStart',tm(s&&s.start));
put('luxWork',hms(work));
put('luxRest',hms(rest));
put('luxCount',(br.length+(paused?1:0))+' / 2');
let color=paused&&elapsed>=1800000?'#ef7777':paused&&elapsed>=1500000?'#efa954':'#d8b575';
let p=Math.min(100,(paused?elapsed/1800000:work/32400000)*100);
q('luxTimer').style.color=color;
q('luxRing').style.background='conic-gradient('+color+' '+p+'%, #343538 0)';
put('luxRemain',paused?(elapsed>=1800000?'OVERTIME +'+hms(elapsed-1800000):'REMAINING '+hms(1800000-elapsed)):active?'ON DUTY':s?'OFF DUTY':'STANDBY');
put('luxWarning',paused?(elapsed>=1800000?'انتهى وقت الراحة المخطط':elapsed>=1500000?'باقي أقل من 5 دقائق':''):'');
if(paused&&elapsed>=1500000){
let key=s.pause+'-'+(elapsed>=1800000?30:25);
if(!alerts.has(key)){alerts.add(key);beep()}
}
put('luxLog',br.map((b,i)=>'Break '+(i+1)+' | '+tm(b[0])+' — '+tm(b[1])).join(' | ')+(paused?' | بداية البريك '+tm(s.pause):''));
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',tick);
q('day').addEventListener('change',tick);
tick();
})();
</script>

let day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Vienna'}).format(new Date());
list.textContent='';
let events=data.events.filter(e=>e.date===day).sort((a,b)=>a.end.localeCompare(b.end));
let info=document.createElement('p');
info.textContent='LIVE EVENTS | '+events.length+' حفلات اليوم | آخر تحديث: '+new Date(data.updated).toLocaleString('de-AT',{timeZone:'Europe/Vienna'});
list.append(info);
events.forEach(e=>{
let parts=e.end.split(':').map(Number);
let mins=(parts[0]*60+parts[1]+1440-15)%1440;
let arrival=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
let d=document.createElement('div');
d.style.cssText='background:#252629;border:1px solid #554a35;border-radius:15px;padding:15px;margin:12px 0';
let h=document.createElement('h2');
h.style.color='#d8b575';
h.textContent=e.venue;
let t=document.createElement('h2');
t.textContent=e.start+' - '+e.end;
let a=document.createElement('p');
a.style.color='#75d39f';
a.textContent='الوصول المقترح: '+arrival;
d.append(h,t,a);
list.append(d);
});
if(!events.length)list.append('لا توجد حفلات مسجلة اليوم');
}catch(e){list.textContent='تعذر تحميل الحفلات: '+e.message;}
}
liveEvents();
setInterval(liveEvents,300000);
})();
</script>
