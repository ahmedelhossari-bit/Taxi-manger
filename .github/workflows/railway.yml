name: TAXI PRO Railway Radar
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/railway.yml']
permissions:
  contents: write
concurrency:
  group: taxi-railway
  cancel-in-progress: false
jobs:
  railway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OEBB Live Data
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          def api(method, params):
              payload={
                  'id':'1',
                  'ver':'1.67',
                  'lang':'deu',
                  'auth':{'type':'AID','aid':'OWDL4fE4ixNiPBBm'},
                  'client':{'id':'OEBB','type':'WEB','name':'webapp','l':'vs_webapp'},
                  'formatted':False,
                  'svcReqL':[{'meth':method,'req':params}]
              }
              req=urllib.request.Request(
                  'https://fahrplan.oebb.at/bin/mgate.exe',
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type':'application/json'},
                  method='POST'
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
              result=data['svcResL'][0]
              if result.get('err')!='OK':
                  raise RuntimeError(str(result))
              return result['res']

          def seconds(t):
              if not t or not t.isdigit():
                  return None
              t=t.zfill(6)
              return int(t[:-6] or 0)*86400+int(t[-6:-4])*3600+int(t[-4:-2])*60+int(t[-2:])

          def clock(t):
              return t[-6:-4]+':'+t[-4:-2] if t and len(t)>=6 else None

          stations=[
              ('Wien Hauptbahnhof','8103000'),
              ('Wien Westbahnhof','8100003'),
              ('Wien Meidling','8100514'),
              ('Wien Mitte','8101949'),
              ('Flughafen Wien',None)
          ]
          now=datetime.now(ZoneInfo('Europe/Vienna'))
          output={
              'source':'OEBB SCOTTY',
              'updated':datetime.now(timezone.utc).isoformat(),
              'stations':[]
          }

          for name,sid in stations:
              item={'name':name,'id':sid,'status':'OK','alerts':[],'records':0,'errors':[]}
              if sid is None:
                  try:
                      locations=api('LocMatch',{'input':{'field':'S','loc':{'name':'Flughafen Wien Bahnhof','type':'ALL'},'maxLoc':20}})['match']['locL']
                      candidates=[s for s in locations if s.get('type')=='S' and s.get('extId') and s.get('name','').strip().casefold() in ('flughafen wien bahnhof','flughafen wien','wien flughafen bahnhof','wien flughafen')]
                      if not candidates:
                          raise RuntimeError('Airport station not resolved: '+str([(s.get('name'),s.get('extId')) for s in locations]))
                      sid=candidates[0]['extId']
                      item['id']=sid
                      print('Airport resolved:',candidates[0].get('name'),sid)
                  except Exception as e:
                      item['status']='ERROR'
                      item['errors'].append(str(e))
                      output['stations'].append(item)
                      continue
              for board in ['ARR','DEP']:
                  try:
                      data=api('StationBoard',{
                          'type':board,
                          'stbLoc':{'type':'S','extId':sid},
                          'date':now.strftime('%Y%m%d'),
                          'time':now.strftime('%H%M%S'),
                          'maxJny':100,
                          'dur':120
                      })
                      products=data.get('common',{}).get('prodL',[])
                      prefix='a' if board=='ARR' else 'd'
                      for j in data.get('jnyL',[]):
                          stop=j.get('stbStop',{})
                          ix=stop.get(prefix+'ProdX',j.get('prodX',-1))
                          prod=products[ix] if isinstance(ix,int) and 0<=ix<len(products) else {}
                          train=prod.get('name','Unknown')
                          if train.lower().startswith(('tram','bus','u-bahn')):
                              continue
                          planned=stop.get(prefix+'TimeS')
                          actual=stop.get(prefix+'TimeR')
                          p,a=seconds(planned),seconds(actual)
                          delay=round((a-p)/60) if p is not None and a is not None else None
                          cancelled=bool(stop.get(prefix+'Cncl') or j.get('isCncl') or j.get('isCancelled'))
                          item['records']+=1
                          if cancelled or (delay is not None and delay>=10):
                              item['alerts'].append({
                                  'train':train,
                                  'board':board,
                                  'direction':j.get('dirTxt'),
                                  'planned':clock(planned),
                                  'expected':clock(actual),
                                  'delay':delay,
                                  'cancelled':cancelled
                              })
                  except Exception as e:
                      item['errors'].append(str(e))
                  time.sleep(2)
              if item['errors']:
                  item['status']='PARTIAL' if len(item['errors'])==1 else 'ERROR'
              output['stations'].append(item)
              print(name,item['status'],'Records:',item['records'],'Alerts:',len(item['alerts']))

          if not any(s['status']!='ERROR' for s in output['stations']):
              raise RuntimeError('All stations failed')

          with open('railway.json','w',encoding='utf-8') as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          print('RAILWAY RADAR SUCCESSFUL')
          PY
      - name: Save railway data
        run: |
          git config user.name "TAXI PRO Railway"
          git config user.email "railway@users.noreply.github.com"
          git add railway.json
          git diff --cached --quiet && exit 0
          git commit -m "Update OEBB radar"
          git pull --rebase
          git push
