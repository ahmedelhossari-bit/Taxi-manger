name: TAXI PRO Railway Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test OEBB SCOTTY
        run: |
          python3 - <<'PY'
          import urllib.request,json
          url='https://fahrplan.oebb.at/bin/mgate.exe'
          payload={
            'id':'1',
            'ver':'1.67',
            'lang':'deu',
            'auth':{'type':'AID','aid':'OWDL4fE4ixNiPBBm'},
            'client':{'id':'OEBB','type':'WEB','name':'webapp','l':'vs_webapp'},
            'formatted':False,
            'svcReqL':[{
              'meth':'LocMatch',
              'req':{'input':{'field':'S','loc':{'name':'Wien Hbf','type':'ALL'},'maxLoc':10}}
            }]
          }
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          print(json.dumps(data,ensure_ascii=False,indent=2))
          assert data['svcResL'][0]['res']['match']['locL']
          print('OEBB CONNECTION SUCCESSFUL')
          PY
