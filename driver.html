<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>TAXI PRO Driver</title><body style="background:#151515;color:#d8b575;font:16px system-ui;padding:24px"><h2>TAXI PRO</h2><p id="status">Checking membership…</p><a href="./membership.html" style="color:inherit">Back to account</a><script>
(async()=>{const root='https://znnrrfrykluzhkcrvboh.supabase.co',key='sb_publishable_EtPcLHtzk2hMFsYyER2csw_PMy36tCa',sk='tp.driver.session';let s;async function api(path,method='GET',body,t){const x=await fetch(root+path,{method,headers:{apikey:key,Authorization:'Bearer '+(t||key),'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!x.ok)throw Error('Account verification failed ('+x.status+')');return x.json().catch(()=>null)}try{s=JSON.parse(sessionStorage.getItem(sk)||'null');if(!s?.access_token)throw Error('Please sign in first.');async function verify(){if(s.expires_at&&s.expires_at<Date.now()/1000+90){s=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:s.refresh_token});sessionStorage.setItem(sk,JSON.stringify(s))}const u=await api('/auth/v1/user','GET',null,s.access_token);const rows=await api('/rest/v1/driver_profiles?id=eq.'+encodeURIComponent(u.id)+'&select=status,full_name','GET',null,s.access_token);if(!u.email_confirmed_at||rows[0]?.status!=='approved')throw Error('Membership approval required.');return {u,row:rows[0]}}const {u,row}=await verify();window.tpDriverPrefix='tp.driver.'+u.id+'.';window.tpDriverName=row.full_name;window.tpDriverLang=localStorage.getItem('tp.member.language')||'en';window.tpDriverLogout=async()=>{sessionStorage.removeItem(sk);try{await api('/auth/v1/logout','POST',{},s.access_token)}catch(e){}location.replace('./membership.html')};const res=await fetch('./driver-app.txt',{cache:'no-cache'});if(!res.ok)throw Error('Driver app not published yet.');const html=await res.text();document.open();document.write(html);document.close();let checking=false;setInterval(async()=>{if(checking)return;checking=true;try{await verify()}catch(e){location.replace('./membership.html')}finally{checking=false}},60000)}catch(e){document.getElementById('status').textContent=e.message}})();
</script></body></html>
