<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>TAXI PRO | Membership</title><style>
*{box-sizing:border-box}body{margin:0;background:#151619;color:#eee;font:16px system-ui;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(100%,420px);background:#1e2023;border:1px solid #514633;border-radius:24px;padding:24px}h1{text-align:center;color:#d8b575;letter-spacing:4px;margin:12px 0}header p{text-align:center;color:#aaa;font-size:12px;letter-spacing:1px}label{display:block;margin:12px 0 5px;color:#ccc}input,button{font:inherit;width:100%;padding:13px;border-radius:10px}input{background:#292b30;border:1px solid #555;color:white}button{background:#d8b575;color:#111;border:0;font-weight:700;margin-top:14px;cursor:pointer}button.secondary{background:transparent;color:#d8b575;border:1px solid #756344}button:disabled{opacity:.5}small,footer{color:#aaa}footer{text-align:right;font-size:11px;margin-top:26px;color:#b59a70}#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#e8cf9c} [hidden]{display:none!important}</style></head><body><main><header><h1>TAXI PRO</h1><p>EXCLUSIVELY FOR PROFESSIONAL DRIVERS</p></header><h2 id="heading">Sign in</h2><form id="auth"><div id="extra" hidden><label for="fullname">Full name</label><input id="fullname" autocomplete="name" maxlength="120"><label for="username">Username</label><input id="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,32}" maxlength="32"></div><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8"><button id="submit">Sign in</button></form><button class="secondary" id="switch">Create an account</button><button class="secondary" id="logout" hidden>Sign out</button><p id="message" role="status"></p><small>Membership pilot. Document upload and access to driver tools are not enabled yet.</small><footer>Founded by Ahmed Elhosary</footer></main><script>
const root='https://znnrrfrykluzhkcrvboh.supabase.co',key='sb_publishable_EtPcLHtzk2hMFsYyER2csw_PMy36tCa',q=id=>document.getElementById(id);let signup=false,busy=false,session=null;
const msg=t=>q('message').textContent=t;
async function api(path,method='GET',body,token){const response=await fetch(root+path,{method,headers:{apikey:key,Authorization:'Bearer '+(token||key),'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});const j=await response.json().catch(()=>({}));if(!response.ok)throw Error(j.msg||j.message||j.error_description||'Request failed ('+response.status+')');return j}
function mode(){q('extra').hidden=!signup;q('fullname').required=signup;q('username').required=signup;q('password').autocomplete=signup?'new-password':'current-password';q('heading').textContent=signup?'Create an account':'Sign in';q('submit').textContent=q('heading').textContent;q('switch').textContent=signup?'Back to sign in':'Create an account';msg('')}
q('switch').onclick=()=>{if(!busy){signup=!signup;mode()}};
async function signedIn(s){session=s;const u=await api('/auth/v1/user','GET',undefined,s.access_token);if(!u.email_confirmed_at)throw Error('Confirm your email first.');let rows=await api('/rest/v1/driver_profiles?id=eq.'+encodeURIComponent(u.id)+'&select=status,username','GET',undefined,s.access_token);if(!rows.length&&u.user_metadata?.username&&u.user_metadata?.full_name){await api('/rest/v1/driver_profiles','POST',{id:u.id,username:u.user_metadata.username,full_name:u.user_metadata.full_name},s.access_token);rows=await api('/rest/v1/driver_profiles?id=eq.'+encodeURIComponent(u.id)+'&select=status,username','GET',undefined,s.access_token)}q('auth').hidden=true;q('switch').hidden=true;q('logout').hidden=false;q('heading').textContent='Account';msg(rows.length?'Account status: '+rows[0].status+'\nDriver tools are not enabled in this pilot.':'Email verified. Owner provisioning or profile setup is required.');}
q('auth').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;q('submit').disabled=true;try{const email=q('email').value.trim(),password=q('password').value;if(signup){const redirect=location.origin+location.pathname;await api('/auth/v1/signup?redirect_to='+encodeURIComponent(redirect),'POST',{email,password,data:{username:q('username').value.trim(),full_name:q('fullname').value.trim()}});q('password').value='';msg('If registration is available, check your email and confirm your address before signing in.')}else{const s=await api('/auth/v1/token?grant_type=password','POST',{email,password});q('password').value='';await signedIn(s)}}catch(e){session=null;msg(e.message)}finally{busy=false;q('submit').disabled=false}};
q('logout').onclick=async()=>{try{if(session)await api('/auth/v1/logout','POST',undefined,session.access_token)}catch(e){}session=null;location.replace(location.pathname)};
if(location.hash){history.replaceState(null,'',location.pathname+location.search);msg('Email confirmation returned. Please sign in.')}
</script></body></html>
